{% macro school_card(s, filterable=False) -%}
<div class="school-item{% if s.gender %} {{ s.gender }}{% endif %}"{% if filterable %} data-search="{{ (s.name ~ ' ' ~ s.location)|lower }}" data-district="{{ s.district }}" data-gender="{{ s.gender }}" data-found="{{ s.founded }}" data-type="{{ s.hs_type }}"{% endif %}>
<a class="school-item-main" href="{{ url_for('school_meal_view', school_code=s.code) }}">
<div class="school-item-head"><span class="school-item-name">{{ s.name }}</span><span class="school-item-go">급식 보기</span></div>
<div class="school-item-loc">{{ s.location }}</div>
<div class="school-item-tags">{% for t in s.tags %}<span class="school-tag">{{ t }}</span>{% endfor %}</div>
</a>
<a class="school-item-info" href="{{ url_for('school_overview', code=s.code) }}">학교 정보 &rsaquo;</a>
</div>
{%- endmacro %}
