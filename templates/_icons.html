{% macro icon(name, size=20) -%}
<svg class="ico" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'sun' -%}
<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
{%- elif name == 'moon' -%}
<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
{%- elif name == 'monitor' -%}
<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
{%- elif name == 'school' -%}
<path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M10 21v-5h4v5"/><path d="M12 5V2.5"/>
{%- elif name == 'calendar' -%}
<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
{%- elif name == 'clock' -%}
<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'utensils' -%}
<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
{%- elif name == 'chevron-left' -%}
<path d="m15 18-6-6 6-6"/>
{%- elif name == 'chevron-right' -%}
<path d="m9 18 6-6-6-6"/>
{%- elif name == 'x' -%}
<path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == 'map-pin' -%}
<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
{%- elif name == 'share' -%}
<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>
{%- elif name == 'link' -%}
<path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>
{%- elif name == 'bell' -%}
<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
{%- elif name == 'info' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/>
{%- elif name == 'eye' -%}
<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'pointer' -%}
<path d="M9 9l11 4-5 2-2 5z"/><path d="M5 3v3M3 5h3M7.5 7.5 6 6"/>
{%- elif name == 'users' -%}
<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/>
{%- endif -%}
</svg>
{%- endmacro %}
