{% from '_icons.html' import icon -%}
<footer class="main-footer">
        <div class="footer-content">
            <p>본 웹사이트는 사용자 경험 개선을 위해 쿠키를 사용합니다. 계속 탐색하시면 쿠키 사용에 동의하는 것으로 간주됩니다.</p>
            <div class="footer-links">
                <a href="/terms">이용약관</a>
                <a href="/privacy">개인정보처리방침</a>
                <a href="mailto:{{ contact_email }}">문의하기</a>
            </div>
            <p>&copy; 2026 급식알리미. All rights reserved.</p>
        </div>
    </footer>

    <div id="themePopover" class="theme-popover">
        <div class="theme-option" data-value="light">
            <span>라이트 모드</span>
            <span>{{ icon('sun', 18) }}</span>
        </div>
        <div class="theme-option" data-value="dark">
            <span>다크 모드</span>
            <span>{{ icon('moon', 18) }}</span>
        </div>
        <div class="theme-option" data-value="system">
            <span>시스템 설정</span>
            <span>{{ icon('monitor', 18) }}</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('themeToggleBtn');
            const popover = document.getElementById('themePopover');
            const options = document.querySelectorAll('.theme-option');
            const iconLight = document.querySelector('.theme-icon-light');
            const iconDark = document.querySelector('.theme-icon-dark');

            function updateIcon() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    if(iconLight) iconLight.style.display = 'none';
                    if(iconDark) {
                        iconDark.style.display = 'block';
                        iconDark.style.fill = 'currentColor';
                    }
                } else {
                    if(iconLight) {
                        iconLight.style.display = 'block';
                        iconLight.style.fill = 'currentColor';
                    }
                    if(iconDark) iconDark.style.display = 'none';
                }
            }

            if (toggleBtn && popover) {
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    popover.classList.toggle('show');
                    const currentTheme = localStorage.getItem('theme') || 'system';
                    options.forEach(opt => {
                        opt.classList.toggle('active', opt.dataset.value === currentTheme);
                    });
                });

                document.addEventListener('click', (e) => {
                    if (!popover.contains(e.target) && !toggleBtn.contains(e.target)) {
                        popover.classList.remove('show');
                    }
                });

                options.forEach(option => {
                    option.addEventListener('click', () => {
                        const theme = option.dataset.value;
                        localStorage.setItem('theme', theme);
                        
                        if (theme === 'system') {
                            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                                document.documentElement.setAttribute('data-theme', 'dark');
                            } else {
                                document.documentElement.removeAttribute('data-theme');
                            }
                        } else if (theme === 'dark') {
                            document.documentElement.setAttribute('data-theme', 'dark');
                        } else {
                            document.documentElement.removeAttribute('data-theme');
                        }
                        
                        updateIcon();
                        popover.classList.remove('show');
                    });
                });

                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (!localStorage.getItem('theme') || localStorage.getItem('theme') === 'system') {
                        if (e.matches) {
                            document.documentElement.setAttribute('data-theme', 'dark');
                        } else {
                            document.documentElement.removeAttribute('data-theme');
                        }
                        updateIcon();
                    }
                });
                updateIcon();
            }
        });
    </script>
